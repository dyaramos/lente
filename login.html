<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lente</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">

        <a href="index.html" class="logo">
            <img src="images/logotext1.png" alt="Lente">
        </a>

        <nav class="main-nav">

            <a href="index.html">Home</a>

            <div class="nav-dropdown">
                <a href="shop.html">Shop ▾</a>

                <div class="dropdown-menu">
                    <a href="shop.html">All Products</a>
                    <a href="shop.html#dslr">DSLR</a>
                    <a href="shop.html#mirrorless">Mirrorless</a>
                    <a href="shop.html#digicam">Digicam</a>
                    <a href="shop.html#film">Film</a>
                    <a href="shop.html#action">Action Camera</a>
                    <a href="shop.html#accessories">Accessories</a>
                </div>
            </div>

            <a href="new-in.html">New In</a>
            <a href="best-sellers.html">Best Sellers</a>
            <a href="index.html#collections">Collections</a>
            <a href="index.html#brands">Brands</a>
            <a href="index.html#about">About</a>

        </nav>

        <div class="header-actions">

            <button>
                <i data-lucide="search"></i>
            </button>

            <button>
                <i data-lucide="user"></i>
            </button>

            <button class="cart-button">
                <i data-lucide="shopping-cart"></i>
                <span>1 Item</span>
            </button>

        </div>

    </header>


    <!-- LOGIN -->
    <main class="login-section">

        <div class="login-container">

            <!-- LEFT IMAGE -->
            <figure class="login-image">

                <img src="images/login-camera.png" alt="Camera">

                <figcaption>
                    Capture what matters.
                </figcaption>

            </figure>


            <!-- RIGHT FORM -->
            <div class="login-form">

                <span class="login-label">
                    WELCOME BACK
                </span>

                <h1>
                    Hello!
                    <br>
                    Welcome Back
                </h1>

                <p class="login-subtitle">
                    Sign in to continue shopping with Lente.
                </p>


                <form id="loginForm" onsubmit="handleLogin(event)">

                    <!-- EMAIL -->
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        list="email-list"
                        placeholder="Enter your email"
                        required
                    >

                    <datalist id="email-list">
                        <option value="@gmail.com">
                        <option value="@yahoo.com">
                        <option value="@outlook.com">
                    </datalist>


                    <!-- PASSWORD -->
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="8"
                        required
                    >


                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>


                    <!-- SIGN IN BUTTON -->
                    <button type="submit" class="signin-button">
                        Sign In
                    </button>

                </form>


                <!-- LANGUAGE -->
                <select class="language-select">

                    <optgroup label="Language">
                        <option>English</option>
                        <option>Filipino</option>
                        <option>日本語</option>
                    </optgroup>

                </select>


                <div class="login-divider">
                    <span>or continue with</span>
                </div>


                <!-- SOCIAL BUTTONS -->
                <div class="social-login">

                    <button type="button" class="social-button">
                        G
                    </button>

                    <button type="button" class="social-button">
                        
                    </button>

                    <button type="button" class="social-button">
                        f
                    </button>

                </div>


                <p class="create-account">
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>

            </div>

        </div>

    </main>


    <script>
        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address.');
                return;
            }

            if (password.length < 8) {
                alert('Password must be at least 8 characters.');
                return;
            }

            // Save logged-in state
            localStorage.setItem('lente_user', email);

            // Redirect to homepage
            window.location.href = 'index.html';
        }

        lucide.createIcons();
    </script>

</body>

</html>
